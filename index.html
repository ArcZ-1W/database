<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArcZ Ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<style>
:root{
  --ink:#0f1b3d; --ink-2:#3b4a6e; --ink-3:#7886a6;
  --blue:#2563eb; --blue-2:#4f8bff; --sky:#dbe9ff; --ice:#f3f8ff;
  --ok:#0f9d6b; --warn:#d98a00; --bad:#d6334a;
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.82);
  --edge:rgba(255,255,255,.9); --line:rgba(37,99,235,.14);
  --shadow:0 10px 40px -12px rgba(37,99,235,.22);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);background:#eef4ff;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);pointer-events:none}
body::before{width:46vw;height:46vw;left:-10vw;top:-12vw;background:radial-gradient(circle,#9cc2ff 0%,transparent 70%)}
body::after{width:52vw;height:52vw;right:-14vw;bottom:-16vw;background:radial-gradient(circle,#bcd5ff 0%,transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}

.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.8)}

/* ---- Buttons / inputs ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--r-md);font-weight:600;font-size:14.5px;transition:transform .12s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(180deg,var(--blue-2),var(--blue));color:#fff;box-shadow:0 8px 20px -8px rgba(37,99,235,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-primary:hover{box-shadow:0 10px 24px -8px rgba(37,99,235,.85),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-soft{background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--blue)}
.btn-soft:hover{background:#fff}
.btn-danger{background:rgba(214,51,74,.1);color:var(--bad)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field small{font-size:12px;color:var(--ink-3)}
.input{width:100%;padding:11px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:rgba(255,255,255,.75);outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--blue-2);box-shadow:0 0 0 4px rgba(79,139,255,.18)}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.diamond{width:15px;height:15px;flex:none;fill:url(#dg);stroke:#1d4fd8;stroke-width:1}
.err{color:var(--bad);font-size:13.5px;min-height:18px;margin-top:4px}

/* ---- Auth ---- */
#auth,#face{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow:auto}
.auth-card{width:100%;max-width:410px;padding:34px 30px;border-radius:28px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;letter-spacing:-1px;background:linear-gradient(145deg,#6aa2ff,#1f4fd8);box-shadow:0 8px 18px -6px rgba(37,99,235,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.brand b{font-size:21px;letter-spacing:-.4px}
.auth-card h1{font-size:26px;letter-spacing:-.6px;line-height:1.2;margin-bottom:6px}
.auth-card p.sub{color:var(--ink-2);font-size:14.5px;margin-bottom:24px;line-height:1.5}

/* ---- Face ---- */
.face-card{width:100%;max-width:460px;padding:28px;border-radius:28px;text-align:center}
.cam{position:relative;width:min(300px,72vw);aspect-ratio:1;margin:18px auto;border-radius:50%;overflow:hidden;background:#dfeaff;border:4px solid #fff;box-shadow:0 0 0 2px var(--blue-2),var(--shadow)}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam.scan::after{content:"";position:absolute;left:0;right:0;height:46%;background:linear-gradient(180deg,transparent,rgba(79,139,255,.35),transparent);animation:scan 1.8s ease-in-out infinite}
@keyframes scan{0%{top:-46%}100%{top:100%}}
.face-status{min-height:44px;font-size:14.5px;color:var(--ink-2);line-height:1.45}
.dots{display:flex;gap:8px;justify-content:center;margin:6px 0 14px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--sky);transition:background .2s}
.dots i.on{background:var(--blue)}

/* ---- App shell ---- */
#app{position:fixed;inset:0;display:flex;gap:16px;padding:16px}
.side{width:260px;flex:none;border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:6px}
.side .brand{margin-bottom:18px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;font-weight:550;font-size:14.5px;color:var(--ink-2);text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.7)}
.nav button.on{background:#fff;color:var(--blue);box-shadow:0 4px 14px -6px rgba(37,99,235,.35)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.mini{padding:14px;border-radius:16px;background:rgba(255,255,255,.65);border:1px solid var(--line)}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:var(--blue);font-weight:700;flex:none}
.who span{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.who small{display:block;color:var(--ink-3);font-weight:400;font-size:12px}
.main{flex:1;min-width:0;border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.head{padding:20px 26px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h2{font-size:22px;letter-spacing:-.5px}
.scroll{overflow:auto;padding:14px 26px 26px;flex:1;min-height:0}

/* ---- Bars ---- */
.meter{margin-bottom:14px}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px;gap:8px}
.meter .top b{font-weight:600;color:var(--ink-2)}
.meter .top span{color:var(--ink-3);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:rgba(37,99,235,.1);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue-2),var(--blue));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.warn>i{background:linear-gradient(90deg,#f6b73c,var(--warn))}
.bar.bad>i{background:linear-gradient(90deg,#ff7a8c,var(--bad))}

/* ---- Chat ---- */
.chat-top{padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.chat-top select{max-width:260px}
.tokrow{padding:10px 20px 0}
.tokrow .meter{margin:0 0 10px}
.tokrow .bar{height:7px}
.tokrow .top{margin-bottom:4px}
.msgs{flex:1;min-height:0;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:min(760px,88%);padding:13px 16px;border-radius:18px;line-height:1.6;font-size:15px;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:linear-gradient(180deg,var(--blue-2),var(--blue));color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--glass-strong);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg pre{background:#0f1b3d;color:#e8f0ff;padding:12px 14px;border-radius:12px;overflow:auto;margin:10px 0;font-size:13px}
.msg code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.msg :not(pre)>code{background:rgba(37,99,235,.1);padding:1px 6px;border-radius:6px}
.msg ul{padding-left:20px;margin:6px 0}
.msg h3,.msg h4{margin:10px 0 4px}
.msg .atts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);max-width:220px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.user .chip{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);color:#fff}
.chip button{color:inherit;display:grid;place-items:center}
.chip .icon{width:14px;height:14px}
.tokinfo{align-self:flex-start;font-size:12.5px;color:var(--ink-2);background:rgba(37,99,235,.08);padding:7px 12px;border-radius:10px;font-variant-numeric:tabular-nums}
.empty{margin:auto;text-align:center;max-width:380px;color:var(--ink-2);line-height:1.6}
.empty .logo{margin:0 auto 14px;width:54px;height:54px;font-size:24px;border-radius:17px}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px;letter-spacing:-.3px}
.composer{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.attrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cbox{display:flex;align-items:flex-end;gap:8px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:20px;padding:8px 8px 8px 12px}
.cbox textarea{flex:1;border:0;background:none;outline:none;resize:none;max-height:150px;padding:8px 2px;line-height:1.5}
.iconbtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--sky)}
.send{background:linear-gradient(180deg,var(--blue-2),var(--blue));color:#fff}
.send:hover{background:linear-gradient(180deg,var(--blue-2),var(--blue))}
.dotload{display:inline-flex;gap:4px}.dotload i{width:7px;height:7px;border-radius:50%;background:var(--blue-2);animation:bl 1s infinite}
.dotload i:nth-child(2){animation-delay:.15s}.dotload i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ---- Cards / lists ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{padding:20px;border-radius:var(--r-lg);background:var(--glass-strong);border:1px solid var(--edge);box-shadow:var(--shadow)}
.card h3{font-size:16px;margin-bottom:14px;letter-spacing:-.2px}
.daysbig{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.daysbig b{font-size:44px;letter-spacing:-2px;line-height:1;color:var(--blue)}
.daysbig span{color:var(--ink-2)}
.mem{display:flex;flex-direction:column;gap:12px}
.mem-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mem-head b{display:flex;align-items:center;gap:6px;font-size:15.5px}
.mem-head small{color:var(--ink-3);font-size:12.5px}
.tag{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--sky);color:var(--blue);font-weight:600}
.tag.ok{background:rgba(15,157,107,.12);color:var(--ok)}
.tag.bad{background:rgba(214,51,74,.12);color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--ink-3);font-weight:500}
.mrow{display:grid;grid-template-columns:1.4fr .8fr .6fr 1.5fr auto;gap:8px;align-items:center;margin-bottom:8px}
.sec-title{font-size:13px;font-weight:600;color:var(--ink-2);margin:18px 0 8px}
.logitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.logitem:last-child{border-bottom:0}
.logitem b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.logitem small{color:var(--ink-3);font-size:12.5px}
.lmsg{font-size:13.5px;line-height:1.55;padding:6px 0;border-top:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.lmsg b{color:var(--blue);margin-right:6px}
details.ldet{padding:10px 0;border-bottom:1px solid var(--line)}
details.ldet summary{cursor:pointer;font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:10px}
details.ldet summary small{color:var(--ink-3);font-weight:400}

/* ---- Modal / toast ---- */
.modal-bg{position:fixed;inset:0;background:rgba(15,27,61,.28);backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;z-index:50}
.modal{width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:26px;border-radius:24px}
.modal.wide{max-width:640px}
.modal h3{font-size:19px;margin-bottom:16px;letter-spacing:-.3px}
#toasts{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;display:flex;flex-direction:column;gap:10px;z-index:80;width:min(360px,calc(100vw - 32px))}
.toast{padding:14px 16px;border-radius:16px;animation:tin .25s ease-out}
.toast b{display:block;font-size:14px;margin-bottom:3px}
.toast p{font-size:13.5px;color:var(--ink-2);line-height:1.5;font-variant-numeric:tabular-nums}
.toast.err b{color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ---- Mobile ---- */
@media (max-width:820px){
  body{overflow:hidden}
  #app{flex-direction:column;padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));gap:10px}
  .side{order:2;width:100%;flex-direction:row;padding:6px;border-radius:20px;align-items:center}
  .side .brand,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button{flex-direction:column;gap:3px;font-size:11.5px;padding:7px 4px;flex:1;align-items:center;text-align:center}
  .main{order:1}
  .head{padding:16px 16px 4px}.head h2{font-size:20px}
  .scroll{padding:12px 16px 18px}
  .msgs{padding:16px 12px}.msg{max-width:94%}
  .mrow{grid-template-columns:1fr 1fr}
  .row{flex-direction:column;gap:0}
  .chat-top{padding:10px 12px}
  .tokrow{padding:8px 12px 0}
  #toasts{left:16px;right:16px;width:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fc0ff"/><stop offset="1" stop-color="#2f6bff"/></linearGradient></defs>
</svg>

<div id="toasts"></div>

<!-- LOGIN -->
<section id="auth" class="hidden">
  <div class="auth-card glass">
    <div class="brand"><div class="logo">Az</div><b>ArcZ Ai</b></div>
    <h1>Masuk ke akunmu</h1>
    <p class="sub">Akun dibuat oleh admin. Hubungi admin kalau belum punya username.</p>
    <div class="field"><label for="lu">Username</label><input class="input" id="lu" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
    <div class="field"><label for="lp">Password</label><input class="input" id="lp" type="password" autocomplete="current-password"></div>
    <div class="err" id="lerr"></div>
    <button class="btn btn-primary" id="lbtn" style="width:100%;margin-top:8px">Masuk</button>
  </div>
</section>

<!-- FACE -->
<section id="face" class="hidden">
  <div class="face-card glass">
    <div class="brand" style="justify-content:center"><div class="logo">Az</div><b>ArcZ Ai</b></div>
    <h1 id="ftitle" style="font-size:23px;letter-spacing:-.5px"></h1>
    <p class="face-status" id="fsub"></p>
    <div class="cam" id="cam"><video id="vid" autoplay playsinline muted></video></div>
    <div class="dots" id="fdots"></div>
    <div class="face-status" id="fstat"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-soft" id="fcancel">Batal</button>
      <button class="btn btn-primary" id="fgo">Mulai</button>
    </div>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="side glass">
    <div class="brand"><div class="logo">Az</div><b>ArcZ Ai</b></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="mini" id="sideUsage"></div>
      <div class="who"><div class="avatar" id="av"></div><div style="min-width:0"><span id="wname"></span><small id="wrole"></small></div></div>
      <button class="btn btn-soft btn-sm" id="logout">Keluar</button>
    </div>
  </aside>

  <main class="main glass">
    <!-- chat -->
    <section class="view on" id="v-chat">
      <div class="chat-top">
        <select class="input" id="modelSel"></select>
        <span id="modelTag"></span>
        <button class="btn btn-soft btn-sm" id="clearChat" style="margin-left:auto">Chat baru</button>
      </div>
      <div class="tokrow" id="tokRow"></div>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <div class="attrow" id="attrow"></div>
        <div class="cbox">
          <button class="iconbtn" id="attBtn" title="Lampirkan file" aria-label="Lampirkan file"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg></button>
          <input type="file" id="fileIn" multiple class="hidden">
          <textarea id="prompt" rows="1" placeholder="Tulis pesan…"></textarea>
          <button class="iconbtn send" id="sendBtn" aria-label="Kirim"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </section>

    <!-- usage -->
    <section class="view" id="v-usage">
      <div class="head"><h2>Pemakaian</h2></div>
      <div class="scroll" id="usageBody"></div>
    </section>

    <!-- profile -->
    <section class="view" id="v-profile">
      <div class="head"><h2>Profil</h2></div>
      <div class="scroll" id="profileBody"></div>
    </section>

    <!-- admin -->
    <section class="view" id="v-admin">
      <div class="head"><h2>Member</h2><button class="btn btn-primary btn-sm" id="newMember">Buat akun</button></div>
      <div class="scroll"><div class="grid" id="memberList"></div></div>
    </section>

    <!-- settings -->
    <section class="view" id="v-settings">
      <div class="head"><h2>Pengaturan API</h2></div>
      <div class="scroll" id="settingsBody"></div>
    </section>
  </main>
</div>
<!-- ===== ArcZ add-on: tempel SEBELUM </body> (setelah </script> yang lama) ===== -->
<style>
.tokstats{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--ink-3)}
.tokstats b{color:var(--ink);font-variant-numeric:tabular-nums}
.mini .tokstats{flex-direction:column;gap:2px}
.bar.inf>i{background:repeating-linear-gradient(45deg,var(--blue-2) 0 10px,var(--blue) 10px 20px)}
.chip .ext{font-weight:700;font-size:10.5px;background:var(--sky);color:var(--blue);padding:1px 6px;border-radius:6px;flex:none}
.msg.user .chip .ext{background:rgba(255,255,255,.28);color:#fff}
.btn-sm .icon,.mact .icon,.cb-h .icon{width:15px;height:15px}
.mact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mact button{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:9px;font-size:12.5px;color:var(--ink-2);background:rgba(37,99,235,.08)}
.mact button:hover{background:var(--sky)}

/* ---- Parse pesan AI: blok kode, nama file, bahasa ---- */
const Z_EXT={html:'HTML',css:'CSS',js:'JavaScript',jsx:'JSX',ts:'TypeScript',tsx:'TSX',json:'JSON',py:'Python',php:'PHP',java:'Java',sql:'SQL',xml:'XML',yaml:'YAML',md:'Markdown',sh:'Shell',bash:'Shell',c:'C',cpp:'C++',go:'Go',rs:'Rust',txt:'Teks',svg:'SVG'};
const Z_FN=/([\w\-.\/]+\.(?:html?|css|js|mjs|jsx|ts|tsx|json|md|py|php|java|cpp|sql|xml|ya?ml|txt|sh|go|rs|svg|c))\b/i;
const zLbl=l=>Z_EXT[l]||(l?l.toUpperCase():'Kode');
const zExt=n=>{n=String(n||'');return n.includes('.')?n.split('.').pop().slice(0,5).toUpperCase():'FILE'};
const zClean=n=>n.replace(/^\.?\//,'');
function zName(info,before,code){
  let m=info.match(Z_FN);if(m)return zClean(m[1]);
  const f=code.split('\n',1)[0];
  m=f.match(/file(?:name)?\s*[:=]\s*([\w\-.\/]+\.\w+)/i)||f.match(/^\s*(?:<!--|\/\/|\/\*|#)\s*([\w\-.\/]+\.\w{1,5})\s*(?:-->|\*\/)?\s*$/);
  if(m)return zClean(m[1]);
  const prev=before.trimEnd().split('\n').pop()||'';m=prev.length<140&&prev.match(Z_FN);
  return m?zClean(m[1]):'';
}
function zLang(info,name,code){
  let l=(info.trim().split(/\s+/)[0]||'').toLowerCase();
  if(l.includes('.')||l.includes('='))l='';
  if(!l&&name)l=name.split('.').pop().toLowerCase();
  if(!l&&/^\s*(<!doctype html|<html)/i.test(code))l='html';
  return({javascript:'js',typescript:'ts',htm:'html',yml:'yaml',markdown:'md',python:'py'})[l]||l;
}
function zParse(t){
  const out=[],re=/```([^\n`]*)\n([\s\S]*?)(?:```|$)/g;let last=0,m,bi=0;
  while((m=re.exec(t))){
    if(m.index>last)out.push({type:'text',v:t.slice(last,m.index)});
    const code=m[2].replace(/\n$/,''),name=zName(m[1],t.slice(0,m.index),code);
    out.push({type:'code',code,name,lang:zLang(m[1],name,code),bi:bi++});last=re.lastIndex;
  }
  if(last<t.length)out.push({type:'text',v:t.slice(last)});
  return out;
}
function zText(v){
  const p=esc(v).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>'),o=[];let l=false;
  p.split('\n').forEach(x=>{const li=x.match(/^\s*[-*]\s+(.*)/),hd=x.match(/^(#{1,4})\s+(.*)/);
    if(li){if(!l){o.push('<ul>');l=true}o.push('<li>'+li[1]+'</li>');return}
    if(l){o.push('</ul>');l=false}
    if(hd)o.push('<h4>'+hd[2]+'</h4>');else if(x.trim())o.push('<div>'+x+'</div>')});
  if(l)o.push('</ul>');return o.join('');
}
function zBox(s,mi){
  const b=(a,i,t,c)=>`<button class="${c||''}" data-act="${a}" data-mi="${mi}" data-bi="${s.bi}">${ic(i)}<span>${t}</span></button>`,h=s.lang==='html';
  return `<div class="cb"><div class="cb-h"><span class="lang">${esc(zLbl(s.lang))}</span>${s.name?`<span class="fname" title="${esc(s.name)}">${esc(s.name)}</span>`:''}<span class="sp"></span>${b('copycode','copy','Salin')}${h?b('run','play','Jalankan','run')+b('tab','ext','Tab baru')+b('full','full','Layar penuh'):''}</div><pre><code>${esc(s.code)}</code></pre></div>`;
}
const mdz=(t,mi)=>zParse(t).map(s=>s.type==='text'?zText(s.v):zBox(s,mi)).join('');

function renderAtts(){

async function zCopy(t,b){
  try{await navigator.clipboard.writeText(t)}catch{const x=document.createElement('textarea');x.value=t;x.style.cssText='position:fixed;opacity:0';document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch{}x.remove()}
  const s=b&&b.querySelector('span');if(s){const o=s.textContent;s.textContent='Tersalin';setTimeout(()=>s.textContent=o,1400)}

$('msgs').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;

});

/* ---- Preview HTML: dalam sandbox, link href pindah antar-file dari kode AI ---- */
function zHook(){
  window.__arczGo=function(h){parent.postMessage({arcz:'nav',href:String(h)},'*')};
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;if(!a)return;
    var h=a.getAttribute('href');
    if(!h||h.charAt(0)==='#'||/^(javascript|mailto|tel|data|blob):/i.test(h))return;
    e.preventDefault();parent.postMessage({arcz:'nav',href:h},'*');
  },true);
  window.addEventListener('message',function(e){
    var d=e.data;if(!d||d.arcz!=='goto')return;
    var el=document.getElementById(d.id);if(el)el.scrollIntoView({behavior:'smooth'});
  });
}
function zViewer(){
  var D=window.__D,F=D.files,en=D.entry,fr=document.getElementById('f'),pt=document.getElementById('p'),bk=document.getElementById('b'),st=[],cur=null;
  function E(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function cl(p){var o=[];p.split('/').forEach(function(s){if(!s||s==='.')return;if(s==='..')o.pop();else o.push(s)});return o.join('/')}
  function find(p){
    if(!p)return en;if(F[p]!==undefined)return p;
    var t=[p+'.html',p+'/index.html'];for(var i=0;i<t.length;i++)if(F[t[i]]!==undefined)return t[i];
    var b=p.split('/').pop().toLowerCase(),n=Object.keys(F);
    for(var j=0;j<n.length;j++){var x=n[j].split('/').pop().toLowerCase();if(x===b||x.replace(/\.html?$/,'')===b)return n[j]}
    return null;
  }
  function asset(src,dir){
    if(/^(https?:)?\/\/|^data:/i.test(src))return null;
    var p=src.split('#')[0].split('?')[0],f=p.charAt(0)==='/'?cl(p):cl(dir?dir+'/'+p:p);
    if(F[f]!==undefined)return F[f];
    var b=f.split('/').pop();for(var n in F)if(n.split('/').pop()===b)return F[n];return null;
  }
  function build(name){
    var h=F[name],dir=name.split('/').slice(0,-1).join('/');
    h=h.replace(/<link\b[^>]*?href=["']([^"']+)["'][^>]*>/gi,function(m,s){if(!/stylesheet/i.test(m))return m;var c=asset(s,dir);return c===null?m:'<style>'+c+'</style>'});
    h=h.replace(/<script\b([^>]*?)src=["']([^"']+)["']([^>]*)>\s*<\/script>/gi,function(m,a,s,b){var c=asset(s,dir);return c===null?m:'<script'+a+b+'>'+c.replace(/<\/script/gi,'<\\/script')+'<\/script>'});
    h=h.replace(/(^|[^\w$.])((?:window\.|document\.|top\.|parent\.|self\.)?location(?:\.href)?)\s*=(?!=)\s*(['"`])((?:(?!\3)[^\\\n])*)\3/g,'$1__arczGo($3$4$3)');
    h=h.replace(/(^|[^\w$.])((?:window\.|document\.|top\.|parent\.|self\.)?location)\.(?:assign|replace)\(\s*(['"`])((?:(?!\3)[^\\\n])*)\3\s*\)/g,'$1__arczGo($3$4$3)');
    var s='<script>'+D.hook+'<\/script>';
    if(/<head[^>]*>/i.test(h))h=h.replace(/<head[^>]*>/i,function(m){return m+s});
    else if(/<html[^>]*>/i.test(h))h=h.replace(/<html[^>]*>/i,function(m){return m+s});
    else h=s+h;
    return h;
  }
  function show(label,html,push){
    if(push&&cur!==null&&F[cur]!==undefined)st.push(cur);
    cur=label;pt.textContent='/'+label;fr.srcdoc=html;bk.disabled=!st.length;
  }
  bk.onclick=function(){var n=st.pop();if(n!==undefined)show(n,build(n))};
  document.getElementById('r').onclick=function(){if(F[cur]!==undefined)fr.srcdoc=build(cur)};
  document.getElementById('fs').onclick=function(){
    if(parent!==window)parent.postMessage({arcz:'fs'},'*');
    else{var d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen()}
  };
  window.addEventListener('message',function(e){
    if(e.source!==fr.contentWindow)return;var d=e.data;if(!d||d.arcz!=='nav')return;
    var h=String(d.href);
    if(/^(https?:)?\/\//i.test(h)){window.open(h,'_blank');return}
    var i=h.indexOf('#'),hs=i>-1?h.slice(i+1):'',p=h.split('#')[0].split('?')[0],dir=F[cur]!==undefined?cur.split('/').slice(0,-1).join('/'):'';
    var a=p===''?'':p.charAt(0)==='/'?cl(p):cl(dir?dir+'/'+p:p);
    if(p===''&&hs){fr.contentWindow.postMessage({arcz:'goto',id:hs},'*');return}
    var f=find(a);
    if(f===null&&F[cur]!==undefined&&(F[cur].indexOf('id="'+a+'"')>-1||F[cur].indexOf("id='"+a+"'")>-1)){fr.contentWindow.postMessage({arcz:'goto',id:a},'*');return}
    if(f===null){show('?','<!DOCTYPE html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><body style="font-family:system-ui;padding:28px;color:#0f1b3d;line-height:1.6"><h2>Halaman tidak ditemukan</h2><p>Tidak ada file untuk <code>/'+E(a)+'</code> di kode yang dikirim AI.</p><p>File yang tersedia: '+Object.keys(F).map(E).join(', ')+'</p>',true);return}
    if(f===cur){fr.srcdoc=build(cur);return}
    show(f,build(f),true);
  });
  show(en,build(en));
}
function zBuild(files,entry){
  const d=JSON.stringify({files,entry,hook:'('+zHook.toString()+')()'}).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pratinjau</title><style>html,body{height:100%;margin:0}body{display:flex;flex-direction:column;font:14px system-ui;background:#fff}.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#eef4ff;border-bottom:1px solid #cfe0ff}.bar button{border:0;background:#fff;border-radius:8px;padding:5px 10px;font-size:15px;cursor:pointer}.bar button:disabled{opacity:.4}#p{flex:1;color:#3b4a6e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#f{flex:1;border:0;width:100%;background:#fff}</style></head><body><div class="bar"><button id="b" title="Kembali">‹</button><span id="p"></span><button id="r" title="Muat ulang">↻</button><button id="fs" title="Layar penuh">⛶</button></div><iframe id="f" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-pointer-lock"></iframe><script>window.__D='+d+';('+zViewer.toString()+')();<\/script></body></html>';
}
function zFiles(mi,bi){
  const f={},code=t=>zParse(t).filter(s=>s.type==='code'),put=s=>{const n=s.name||(s.lang==='html'?'index.html':'');if(n)f[n]=s.code};
  S.chat.forEach((m,i)=>{if(m.role==='ai'&&i!==mi)code(m.text).forEach(put)});
  const mine=code(S.chat[mi].text);mine.forEach(put);
  const c=mine[bi],en=c.name||'index.html';f[en]=c.code;return{files:f,entry:en};
}
function zPreview(mi,bi,mode){
  const {files,entry}=zFiles(mi,bi),v=zBuild(files,entry);
  if(mode==='tab'){const u=URL.createObjectURL(new Blob([v],{type:'text/html'}));if(!window.open(u,'_blank'))toast('Pop-up diblokir','Izinkan pop-up untuk membuka tab baru.','err');return}
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="pv glass"><div class="pv-h"><b>Pratinjau HTML</b><span style="flex:1"></span><button class="btn btn-soft btn-sm" data-p="tab">${ic('ext')}<span>Tab baru</span></button><button class="btn btn-soft btn-sm" data-p="fs">${ic('full')}<span>Layar penuh</span></button><button class="btn btn-danger btn-sm" data-p="x">${ic('x')}<span>Tutup</span></button></div><iframe class="pv-f" allow="fullscreen" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-pointer-lock"></iframe></div>`;
  const pv=bg.firstChild,fr=pv.querySelector('iframe');fr.srcdoc=v;document.body.appendChild(bg);
  const full=on=>{pv.classList.toggle('full',on);bg.classList.toggle('isfull',on);if(on&&bg.requestFullscreen)bg.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})};
  const fsc=()=>{if(!document.fullscreenElement){pv.classList.remove('full');bg.classList.remove('isfull')}};
  const msg=e=>{if(e.source===fr.contentWindow&&e.data&&e.data.arcz==='fs')full(!pv.classList.contains('full'))};
  const key=e=>{if(e.key==='Escape')close()};
  function close(){window.removeEventListener('message',msg);document.removeEventListener('fullscreenchange',fsc);document.removeEventListener('keydown',key);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});bg.remove()}
  window.addEventListener('message',msg);document.addEventListener('fullscreenchange',fsc);document.addEventListener('keydown',key);
  pv.querySelector('.pv-h').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const a=b.dataset.p;if(a==='x')close();else if(a==='fs')full(!pv.classList.contains('full'));else zPreview(mi,bi,'tab')};
  if(mode==='full')full(true);
}

/* ---- Pin chat: di-pin = disimpan ke server; tidak di-pin / unpin = hanya localStorage ---- */
function loadLocalChat(){
  S.chat=[];S.sid=newSid();S.pinned=false;
  try{const r=JSON.parse(localStorage.getItem('arcz_chat_'+S.user.id)||'null');
    if(Array.isArray(r))S.chat=r;else if(r&&Array.isArray(r.chat)){S.chat=r.chat;S.sid=r.sid||S.sid;S.pinned=!!r.pinned}}catch{}
}
function saveChat(){
  try{localStorage.setItem('arcz_chat_'+S.user.id,JSON.stringify({sid:S.sid,pinned:!!S.pinned,chat:S.chat.slice(-60).map(m=>({...m,atts:(m.atts||[]).map(a=>({name:a.name}))}))}))}catch{}
}
async function saveServerLog(){
  if(!S.pinned||!S.chat.length)return false;
  try{
    const msgs=S.chat.slice(-60).map(m=>m.role==='info'?{role:'info',html:m.html}:{role:m.role,text:m.text||'',atts:(m.atts||[]).map(a=>a.name)}),first=S.chat.find(m=>m.role==='user');
    const {error}=await sb.from('chat_logs').upsert({member_id:S.user.id,session_id:S.sid,title:((first&&first.text)||'Chat').slice(0,60),messages:msgs,updated_at:new Date().toISOString()},{onConflict:'member_id,session_id'});
    if(error)throw error;return true;
  }catch(e){console.error('simpan chat gagal',e);return false}
}
function restoreLog(row){
  if(!row)return;
  S.chat=(row.messages||[]).map(m=>m.role==='info'?{role:'info',html:m.html}:{role:m.role,text:m.text,atts:(m.atts||[]).map(n=>({name:n}))});
  S.sid=row.session_id;S.pinned=true;saveChat();renderMsgs();go('chat');
}
function renderPin(){
  const b=$('pinBtn');if(!b)return;
  b.className='btn btn-sm '+(S.pinned?'btn-primary':'btn-soft');
  b.innerHTML=ic('pin')+'<span>'+(S.pinned?'Dipin':'Pin')+'</span>';
  b.title=S.pinned?'Lepas pin: hapus dari server, tetap di perangkat ini':'Pin: simpan chat ini ke server';
}
async function togglePin(){
  if(S.pinBusy)return;S.pinBusy=true;
  try{
    if(S.pinned){
      const {error}=await sb.from('chat_logs').delete().eq('member_id',S.user.id).eq('session_id',S.sid);
      if(error)return toast('Gagal lepas pin',esc(error.message),'err');
      S.pinned=false;saveChat();renderPin();toast('Pin dilepas','Chat ini sekarang hanya tersimpan di perangkat ini.');return;
    }
    if(!S.chat.length)return toast('Chat kosong','Kirim pesan dulu sebelum di-pin.');
    if(!S.opts.saveLogs)return toast('Penyimpanan dimatikan','Admin menonaktifkan penyimpanan chat ke server.','err');

    S.pinned=true;
    if(!(await saveServerLog())){S.pinned=false;return toast('Gagal menyimpan','Chat belum bisa disimpan ke server.','err')}
    saveChat();renderPin();toast('Chat di-pin','Chat ini tersimpan di server.');
  }finally{S.pinBusy=false;renderPin()}
}

/* ---- Kirim / buat ulang ---- */
function buildContent(text,atts){
  let t=text;const im=[];
  atts.forEach(a=>{
    if(a.kind==='text')t+=`\n\n[File: ${a.name}]\n${a.text}`;
    else if(a.kind==='image')im.push(a);
    else if(!a.kind)t+=`\n\n[Lampiran: ${a.name} (isi tidak tersedia lagi)]`;
    else t+=`\n\n[Lampiran: ${a.name}, ${a.type||'tipe tidak diketahui'}, ${(a.size/1024).toFixed(1)} KB${a.url?', tautan: '+a.url:''}]`;
  });
  return im.length?[{type:'text',text:t},...im.map(a=>({type:'image_url',image_url:{url:a.dataUrl}}))]:t;
}
async function zPre(){
  if(!S.api.key||!S.api.base){toast('API belum diatur',isAdmin()?'Isi API key dan base URL di menu API.':'Minta admin mengisi API key dan base URL.','err');return null}
  await refreshUser();
  const u=S.user,m=curModel(),tier=tierOf(m),real=resolveModel(m),no=(t,b)=>{toast(t,b,'err');return null};
  if(!isAdmin()){
    if(!u.active)return no('Akun nonaktif','Hubungi admin.');
    if(isExpired(u))return no('Akun kedaluwarsa','Masa berlaku akun sudah habis.');
    if(tier==='premium'&&!u.premium)return no('Khusus premium','Model ini butuh akses premium. Minta admin mengaktifkannya.');
    const k=tier==='other'?'other':'auto';
    if(u['used_'+k]>=u['limit_'+k])return no('Kuota habis',k==='auto'?'Pemakaian Auto sudah habis.':'Pemakaian AI lain sudah habis.');
    if(Number(u.used_tokens||0)>=Number(u.limit_tokens||0))return no('Token habis','Sisa token kamu sudah habis. Minta admin menambah limit.');
  }
  return {u,tier,real};
}
async function send(){
  if(S.busy)return;const text=ta.value.trim();if(!text&&!S.atts.length)return;
  if(S.atts.some(a=>a.uploading)){toast('Tunggu sebentar','File masih diunggah.');return}
  const c=await zPre();if(!c)return;
  const atts=S.atts.slice();S.chat.push({role:'user',text,atts});S.atts=[];renderAtts();ta.value='';ta.style.height='auto';
  await zRun(atts,c);
}
async function zRegen(){
  if(S.busy)return;let i=S.chat.length-1;while(i>=0&&S.chat[i].role!=='user')i--;if(i<0)return;
  const c=await zPre();if(!c)return;
  S.chat.splice(i+1);await zRun(S.chat[i].atts||[],c);
}
async function zRun(atts,c){
  const {u,tier,real}=c;S.busy=true;renderMsgs();
  const hist=S.chat.filter(x=>x.role!=='info').slice(-16);
  const messages=hist.map((x,i)=>({role:x.role==='user'?'user':'assistant',content:(x.role==='user'&&i===hist.length-1)?buildContent(x.text,atts):x.text}));
  try{
    const {data:fresh}=await sb.from('members').select('tokens_used,used_auto,used_other,used_tokens,limit_tokens').eq('id',u.id).single();
    const before=Number(fresh.tokens_used||0);
    const res=await fetch(S.api.base.replace(/\/+$/,'')+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.api.key},body:JSON.stringify({model:real.id,messages})});
    const j=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error((j.error&&(j.error.message||j.error))||('HTTP '+res.status));
    const reply=j.choices&&j.choices[0]&&j.choices[0].message?j.choices[0].message.content:'';
    const raw=(j.usage&&j.usage.total_tokens)?j.usage.total_tokens:Math.ceil((JSON.stringify(messages).length+String(reply).length)/4);
    const mult=Number(real.mult)||1,diff=Math.ceil(raw*mult),after=before+diff;
    const patch={tokens_used:after,used_tokens:Number(fresh.used_tokens||0)+diff};
    if(!isAdmin()){const k=tier==='other'?'used_other':'used_auto';patch[k]=Number(fresh[k]||0)+1}
    await sb.from('members').update(patch).eq('id',u.id);
    await sb.from('usage_logs').insert({member_id:u.id,model:real.id,tier,tokens_before:before,tokens_after:after,tokens_used:diff});
    const left=Math.max(Number(fresh.limit_tokens||0)-patch.used_tokens,0);
    S.chat.push({role:'ai',text:typeof reply==='string'?reply:JSON.stringify(reply)});
    S.chat.push({role:'info',html:`Token: ${fmt(before)} → ${fmt(after)} = <b>${fmt(diff)}</b> terpakai${mult>1?` (${fmt(raw)} × ${mult})`:''}${isAdmin()?'':` · sisa <b>${fmt(left)}</b>`}`});
    toast('Pemakaian token',`Sebelum <b>${fmt(before)}</b><br>Sesudah <b>${fmt(after)}</b><br>Selisih <b>${fmt(diff)} token</b>${isAdmin()?'':`<br>Sisa <b>${fmt(left)}</b> token`}`);
    refreshUser();
  }catch(e){
    console.error(e);S.chat.push({role:'ai',text:'Permintaan gagal: '+(e.message||e)});toast('Gagal memanggil AI',esc(e.message||String(e)),'err');
  }finally{S.busy=false;saveChat();renderMsgs();saveServerLog()}
}
$('sendBtn').onclick=send;
</script>

async function sha256(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
const pwHash = (u,p) => sha256('arcz:' + u.toLowerCase() + ':' + p);
function daysLeft(u){
  if(u.role==='admin' || !u.expires_at) return null;
  return Math.ceil((new Date(u.expires_at) - Date.now()) / 86400000);
}
function tierOf(m){ return m.mult > 10 ? 'premium' : (m.auto ? 'auto' : 'other'); }
function meter(label, used, total, extra){
  const pct = total>0 ? Math.min(100, used/total*100) : 0;
  const cls = pct>=90?'bad':pct>=70?'warn':'';
  return `<div class="meter"><div class="top"><b>${label}</b><span>${extra||`${fmt(used)} / ${fmt(total)}`}</span></div><div class="bar ${cls}"><i style="width:${pct}%"></i></div></div>`;
}
function tokMeter(u, label){
  const lim = Number(u.limit_tokens||0), used = Number(u.used_tokens||0);
  return meter(label||'Token', used, lim, `${fmt(Math.max(lim-used,0))} tersisa dari ${fmt(lim)}`);
}
function daysMeter(u){
  const d = daysLeft(u);
  if(d===null) return '';
  const total = u.valid_days || Math.max(d,1);
  const left = Math.max(d,0);
  const pct = Math.min(100, left/total*100);
  const cls = pct<=15?'bad':pct<=35?'warn':'';
  return `<div class="meter"><div class="top"><b>Masa berlaku</b><span>${left} dari ${total} hari</span></div><div class="bar ${cls}"><i style="width:${pct}%"></i></div></div>`;
}
const dt = (v,o) => new Date(v).toLocaleString('id-ID', o||{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

    }
  }catch(e){ console.error(e); }
  const uid = sessionStorage.getItem('arcz_uid');
  if(uid){
    const {data} = await sb.from('members').select('*').eq('id',uid).maybeSingle();

    sessionStorage.removeItem('arcz_uid');

}

  }finally{ $('lbtn').disabled = false; }
}

/* ============ Face ID ============ */
let faceLoaded=false, stream=null, faceMode=null, faceRun=0;
async function loadFace(){
  if(faceLoaded) return;
  await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS),
    faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODELS),
    faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODELS)
  ]);
  faceLoaded = true;
}
function dots(n,on){ $('fdots').innerHTML = Array.from({length:n},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join(''); }
function startFace(mode){
  faceMode = mode; show('face');
  $('ftitle').textContent = mode==='enroll' ? 'Daftarkan Face ID' : 'Verifikasi wajah';
  $('fsub').textContent = mode==='enroll'
    ? 'Wajahmu belum tercatat. Daftarkan dulu supaya bisa masuk.'

  $('fstat').textContent=''; $('fgo').textContent = mode==='enroll' ? 'Mulai daftar' : 'Verifikasi';

  dots(mode==='enroll'?5:0,0);
}
$('fcancel').onclick = () => { stopCam(); faceRun++; S.user=null; show('auth'); };
$('fgo').onclick = async () => {

    $('fstat').textContent = 'Memuat model wajah…';

    $('fstat').textContent = 'Membuka kamera…';
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:640}});
    $('vid').srcObject = stream; await $('vid').play();
    $('cam').classList.add('scan');
    if(faceMode==='enroll') await doEnroll(run); else await doVerify(run);
  }catch(e){
    console.error(e);
    $('fstat').innerHTML = `<span style="color:var(--bad)">${esc(faceErrMsg(e))}</span>`;
    $('fgo').disabled=false; $('fgo').textContent='Coba lagi';
    stopCam();
  }
};
function faceErrMsg(e){
  if(e && (e.name==='NotAllowedError')) return 'Izin kamera ditolak. Aktifkan akses kamera lalu coba lagi.';
  if(e && (e.name==='NotFoundError')) return 'Kamera tidak ditemukan.';
  if(!window.isSecureContext) return 'Face ID butuh HTTPS atau localhost.';
  return e && e.message ? e.message : 'Face ID gagal. Coba lagi.';
}
function stopCam(){ if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;} $('cam').classList.remove('scan'); }
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function grab(){
  const r = await faceapi.detectSingleFace($('vid'), new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor();
  return r ? r.descriptor : null;
}
async function doEnroll(run){
  const need = 5, got = []; const t0 = Date.now();
  $('fstat').textContent = 'Tatap kamera dan gerakkan kepala sedikit.';
  while(got.length < need){
    if(run!==faceRun) return;
    if(Date.now()-t0 > 40000) throw new Error('Wajah tidak terdeteksi. Cari tempat yang lebih terang.');
    const d = await grab();
    if(d){ got.push(d); dots(need, got.length); await sleep(550); } else await sleep(150);
  }
  const avg = Array.from({length:128},(_,i)=> got.reduce((s,d)=>s+d[i],0)/got.length);
  const {error} = await sb.from('members').update({face_descriptor:avg}).eq('id',S.user.id);
  if(error) throw new Error('Gagal menyimpan Face ID.');
  S.user.face_descriptor = avg;
  stopCam(); toast('Face ID tersimpan','Wajahmu sudah tercatat.'); sessionStorage.setItem('arcz_uid',S.user.id); enterApp();
}
async function doVerify(run){
  const stored = new Float32Array(S.user.face_descriptor);
  const t0 = Date.now(); let tries=0;
  $('fstat').textContent = 'Mencocokkan wajah…';
  while(Date.now()-t0 < 15000){
    if(run!==faceRun) return;
    const d = await grab();
    if(d){
      tries++;
      if(faceapi.euclideanDistance(d, stored) < FACE_THRESHOLD){
        stopCam(); sessionStorage.setItem('arcz_uid',S.user.id); return enterApp();
      }
    }
    await sleep(250);
  }
  throw new Error(tries ? 'Wajah tidak cocok dengan akun ini.' : 'Wajah tidak terdeteksi. Coba di tempat lebih terang.');
}

  const u = S.user;

  <div class="card" style="max-width:520px;margin-bottom:16px">

    <button class="btn btn-primary" id="psave">Simpan nama</button>
  </div>
  <button class="btn btn-danger" id="plogout">Keluar dari akun</button>`;
  $('plogout').onclick = doLogout;

function md(t){
  const h = esc(t).replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${c.replace(/\n$/,'')}</code></pre>`);
  return h.split(/(<pre>[\s\S]*?<\/pre>)/).map(p=>{
    if(p.startsWith('<pre>')) return p;
    p = p.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
    const out=[]; let list=false;
    p.split('\n').forEach(line=>{
      const li = line.match(/^\s*[-*]\s+(.*)/), hd = line.match(/^(#{1,4})\s+(.*)/);
      if(li){ if(!list){out.push('<ul>');list=true;} out.push('<li>'+li[1]+'</li>'); return; }
      if(list){out.push('</ul>');list=false;}
      if(hd) out.push('<h4>'+hd[2]+'</h4>'); else if(line.trim()) out.push('<div>'+line+'</div>');
    });
    if(list) out.push('</ul>');
    return out.join('');
  }).join('');
}

const TEXT_EXT = /\.(txt|md|json|csv|tsv|js|ts|jsx|tsx|html|css|py|java|c|cpp|h|go|rs|php|rb|sql|xml|yml|yaml|ini|log|sh|env|toml)$/i;
function readAs(f, how){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r[how](f); }); }
async function addFile(f){
  if(f.size > 50*1024*1024){ toast('File terlalu besar', esc(f.name)+' melebihi 50 MB.', 'err'); return; }
  const a = {name:f.name, type:f.type, size:f.size, kind:'other', uploading:true};
  S.atts.push(a); renderAtts();
  try{
    if(f.type.startsWith('image/') && f.size < 8*1024*1024){ a.kind='image'; a.dataUrl = await readAs(f,'readAsDataURL'); }
    else if((f.type.startsWith('text/') || TEXT_EXT.test(f.name) || f.type==='application/json') && f.size < 400*1024){ a.kind='text'; a.text = (await readAs(f,'readAsText')).slice(0,60000); }
    const path = `${S.user.id}/${Date.now()}-${f.name.replace(/[^\w.\-]+/g,'_')}`;
    const {error} = await sb.storage.from(BUCKET).upload(path, f, {contentType: f.type||'application/octet-stream'});
    if(!error) a.url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    else toast('Upload ke storage gagal', esc(error.message)+'. Isi file tetap dikirim jika berupa teks atau gambar.', 'err');
  }catch(e){ console.error(e); S.atts = S.atts.filter(x=>x!==a); toast('File gagal dibaca', esc(f.name), 'err'); }
  a.uploading=false; renderAtts();
}
function renderAtts(){
  $('attrow').innerHTML = S.atts.map((a,i)=>`<span class="chip">${ic('file')}<span>${esc(a.name)}${a.uploading?' …':''}</span><button data-i="${i}" aria-label="Hapus">${ic('x')}</button></span>`).join('');
  $('attrow').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.atts.splice(+b.dataset.i,1);renderAtts();});
}

/* ---- kirim ---- */
function buildContent(text, atts){
  let t = text;
  const imgs = [];
  atts.forEach(a=>{
    if(a.kind==='text') t += `\n\n[File: ${a.name}]\n${a.text}`;
    else if(a.kind==='image') imgs.push(a);
    else t += `\n\n[Lampiran: ${a.name}, ${a.type||'tipe tidak diketahui'}, ${(a.size/1024).toFixed(1)} KB${a.url?', tautan: '+a.url:''}]`;
  });
  if(!imgs.length) return t;
  return [{type:'text',text:t}, ...imgs.map(a=>({type:'image_url',image_url:{url:a.dataUrl}}))];
}
async function send(){
  if(S.busy) return;
  const text = ta.value.trim();
  if(!text && !S.atts.length) return;
  if(S.atts.some(a=>a.uploading)){ toast('Tunggu sebentar','File masih diunggah.'); return; }
  if(!S.api.key || !S.api.base){ toast('API belum diatur', isAdmin()?'Isi API key dan base URL di menu API.':'Minta admin mengisi API key dan base URL.', 'err'); return; }

  await refreshUser();
  const u = S.user, m = curModel(), tier = tierOf(m), real = resolveModel(m);
  if(!isAdmin()){
    if(!u.active) return toast('Akun nonaktif','Hubungi admin.','err');
    if(isExpired(u)) return toast('Akun kedaluwarsa','Masa berlaku akun sudah habis.','err');
    if(tier==='premium' && !u.premium) return toast('Khusus premium','Model ini butuh akses premium. Minta admin mengaktifkannya.','err');
    const kind = tier==='other' ? 'other' : 'auto';
    if(u['used_'+kind] >= u['limit_'+kind]) return toast('Kuota habis', kind==='auto'?'Pemakaian Auto sudah habis.':'Pemakaian AI lain sudah habis.', 'err');
    if(Number(u.used_tokens||0) >= Number(u.limit_tokens||0)) return toast('Token habis','Sisa token kamu sudah habis. Minta admin menambah limit.','err');
  }

  const atts = S.atts.slice();
  S.chat.push({role:'user', text, atts}); S.atts=[]; renderAtts();
  ta.value=''; ta.style.height='auto';
  S.busy = true; renderMsgs();

  const history = S.chat.filter(x=>x.role!=='info').slice(-16);
  const messages = history.map((x,i)=>({role:x.role==='user'?'user':'assistant', content: (x.role==='user' && i===history.length-1) ? buildContent(x.text, atts) : x.text}));

  try{
    const {data:fresh} = await sb.from('members').select('tokens_used,used_auto,used_other,used_tokens,limit_tokens').eq('id',u.id).single();
    const before = Number(fresh.tokens_used||0);

    const res = await fetch(S.api.base.replace(/\/+$/,'') + '/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.api.key},
      body: JSON.stringify({model:real.id, messages})
    });
    const j = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error((j.error&&(j.error.message||j.error)) || ('HTTP '+res.status));
    const reply = j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content : '';
    const raw = (j.usage && j.usage.total_tokens) ? j.usage.total_tokens : Math.ceil((JSON.stringify(messages).length + String(reply).length)/4);
    const mult = Number(real.mult)||1;
    const diff = Math.ceil(raw * mult);            // token yang dipotong dari kuota (sudah dikali kelipatan model)
    const after = before + diff;

    const patch = {tokens_used: after, used_tokens: Number(fresh.used_tokens||0) + diff};
    if(!isAdmin()){ const k = tier==='other'?'used_other':'used_auto'; patch[k] = Number(fresh[k]||0) + 1; }
    await sb.from('members').update(patch).eq('id',u.id);
    await sb.from('usage_logs').insert({member_id:u.id, model:real.id, tier, tokens_before:before, tokens_after:after, tokens_used:diff});

    const left = Math.max(Number(fresh.limit_tokens||0) - patch.used_tokens, 0);
    S.chat.push({role:'ai', text: typeof reply==='string' ? reply : JSON.stringify(reply)});
    S.chat.push({role:'info', html:`Token: ${fmt(before)} → ${fmt(after)} = <b>${fmt(diff)}</b> terpakai${mult>1?` (${fmt(raw)} × ${mult})`:''}${isAdmin()?'':` · sisa <b>${fmt(left)}</b>`}`});
    toast('Pemakaian token', `Sebelum <b>${fmt(before)}</b><br>Sesudah <b>${fmt(after)}</b><br>Selisih <b>${fmt(diff)} token</b>${isAdmin()?'':`<br>Sisa <b>${fmt(left)}</b> token`}`);
    refreshUser();
  }catch(e){
    console.error(e);
    S.chat.push({role:'ai', text:'Permintaan gagal: '+(e.message||e)});
    toast('Gagal memanggil AI', esc(e.message||String(e)), 'err');
  }finally{
    S.busy=false; saveChat(); renderMsgs(); saveServerLog();
  }
}

  const bg = modal(`<h3>Log chat · @${esc(m.username)}</h3>${body}<div class="row" style="margin-top:16px"><button class="btn btn-soft" id="lcx">Tutup</button></div>`, true);
  bg.querySelector('#lcx').onclick = () => bg.remove();
  bg.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{ await sb.from('chat_logs').delete().eq('id',b.dataset.dl); bg.remove(); logsModal(m); });
}

function memberForm(m){
  const edit = !!m;
  const bg = modal(`
    <h3>${edit?'Ubah akun':'Buat akun member'}</h3>
    <div class="row">
      <div class="field"><label>Username</label><input class="input" id="mu" ${edit?'disabled':''} value="${edit?esc(m.username):''}" autocapitalize="none" spellcheck="false"></div>
      <div class="field"><label>Nama tampilan</label><input class="input" id="mn" value="${edit?esc(m.display_name||''):''}" placeholder="Kosong = sama dengan username"></div>
    </div>
    <div class="field"><label>${edit?'Password baru':'Password'}</label><input class="input" id="mp" type="text" placeholder="${edit?'Kosongkan jika tidak diganti':''}" autocomplete="off"></div>
    <div class="row">
      <div class="field"><label>Limit Auto</label><input class="input" id="ma" type="number" min="0" value="${edit?m.limit_auto:10}"></div>
      <div class="field"><label>Limit AI lain</label><input class="input" id="mo" type="number" min="0" value="${edit?m.limit_other:5}"></div>
    </div>
    <div class="field"><label>Limit token</label><input class="input" id="mt" type="number" min="0" value="${edit?Number(m.limit_tokens||0):DEFAULT_TOKEN_LIMIT}"></div>
    <div class="field"><label>${edit?'Tambah hari masa berlaku':'Masa berlaku (hari)'}</label><input class="input" id="md" type="number" value="${edit?0:30}"><small>${edit?`Sisa saat ini ${Math.max(daysLeft(m)||0,0)} hari. Angka negatif mengurangi.`:'Akun nonaktif otomatis setelah lewat hari ini.'}</small></div>
    <label style="display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:6px"><input type="checkbox" id="mpr" ${edit&&m.premium?'checked':''}> Akses AI premium ${DIAMOND}</label>
    ${edit?`<label style="display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:6px"><input type="checkbox" id="mac" ${m.active?'checked':''}> Akun aktif</label>`:''}
    <div class="err" id="merr"></div>
    <div class="row" style="margin-top:12px"><button class="btn btn-soft" id="mc">Batal</button><button class="btn btn-primary" id="ms">${edit?'Simpan':'Buat akun'}</button></div>`);
  bg.querySelector('#mc').onclick = () => bg.remove();
  bg.querySelector('#ms').onclick = async () => {
    const g = id => bg.querySelector('#'+id), err = g('merr'); err.textContent='';
    const username = g('mu').value.trim().toLowerCase(), pass = g('mp').value;
    const la = +g('ma').value, lo = +g('mo').value, lt = +g('mt').value, days = +g('md').value;
    if(!edit){
      if(!username) return err.textContent='Username wajib diisi.';
      if(!pass) return err.textContent='Password wajib diisi.';
      if(!(days>0)) return err.textContent='Isi masa berlaku lebih dari 0 hari.';
    }
    if(la<0||lo<0||lt<0||isNaN(la)||isNaN(lo)||isNaN(lt)) return err.textContent='Limit tidak valid.';
    g('ms').disabled = true;
    try{
      if(!edit){
        const {error} = await sb.from('members').insert({
          username, display_name: g('mn').value.trim()||username, password_hash: await pwHash(username,pass),
          role:'member', limit_auto:la, limit_other:lo, limit_tokens:lt, premium:g('mpr').checked,
          valid_days:days, expires_at:new Date(Date.now()+days*86400000).toISOString()
        });
        if(error) throw error;
        toast('Akun dibuat', `Username <b>${esc(username)}</b>. Face ID didaftarkan saat login pertama.`);
      } else {
        const patch = {display_name:g('mn').value.trim()||m.username, limit_auto:la, limit_other:lo, limit_tokens:lt, premium:g('mpr').checked, active:g('mac').checked};
        if(pass) patch.password_hash = await pwHash(m.username,pass);
        if(days){
          const base = Math.max(new Date(m.expires_at).getTime(), Date.now());
          patch.expires_at = new Date(base + days*86400000).toISOString();
          patch.valid_days = Math.max((m.valid_days||0) + days, 1);
        }
        const {error} = await sb.from('members').update(patch).eq('id',m.id);
        if(error) throw error;
        toast('Perubahan disimpan', esc(m.username));
      }
      bg.remove(); renderMembers();
    }catch(e){
      err.textContent = /duplicate|unique/i.test(e.message||'') ? 'Username sudah dipakai.' : (e.message||'Gagal menyimpan.');
      g('ms').disabled=false;
    }
  };
}

/* ============ Admin: pengaturan API ============ */
function renderSettings(){
  $('settingsBody').innerHTML = `
  <div class="card" style="max-width:720px;margin-bottom:16px">
    <h3>Koneksi API</h3>
    <div class="field"><label for="sbase">Base URL</label><input class="input" id="sbase" value="${esc(S.api.base)}" placeholder="https://api.example.com/v1" autocapitalize="none" spellcheck="false"><small>Endpoint: Base URL + /chat/completions dan /models (format OpenAI).</small></div>
    <div class="field"><label for="skey">API key</label><div style="display:flex;gap:8px"><input class="input" id="skey" type="password" value="${esc(S.api.key)}" autocomplete="off"><button class="btn btn-soft" id="skeyShow">Lihat</button></div></div>
  </div>
  <div class="card" style="max-width:720px;margin-bottom:16px">
    <h3>Daftar model</h3>
    <p style="font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-bottom:14px">Model dengan kelipatan token di atas 10x otomatis bertanda diamond dan hanya bisa dipakai member premium. Model yang dicentang Auto memakai kuota Auto; model lain memakai kuota AI lain. Pilihan "Auto" di chat memakai model pertama yang bertanda Auto.</p>
    <div id="mlist"></div>
    <div class="acts"><button class="btn btn-soft btn-sm" id="fetchModels">Ambil model dari API</button><button class="btn btn-soft btn-sm" id="addModel">Tambah model</button></div>
  </div>
  <div class="card" style="max-width:720px;margin-bottom:16px">
    <h3>Log chat</h3>
    <label style="display:flex;gap:10px;align-items:center;font-size:14px"><input type="checkbox" id="optLogs" ${S.opts.saveLogs?'checked':''}> Simpan log chat ke server (maks ${MAX_CHAT_LOGS} percakapan per member)</label>
  </div>
  <button class="btn btn-primary" id="saveApi">Simpan pengaturan</button>`;
  const draw = () => {
    $('mlist').innerHTML = S.models.map((m,i)=>`
      <div class="mrow" data-i="${i}">
        <input class="input" data-f="id" placeholder="ID model" value="${esc(m.id)}" autocapitalize="none" spellcheck="false">
        <input class="input" data-f="label" placeholder="Nama" value="${esc(m.label||'')}">
        <input class="input" data-f="mult" type="number" min="1" step="0.5" value="${m.mult||1}" title="Kelipatan token">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" data-f="auto" ${m.auto?'checked':''}>Auto ${m.mult>10?DIAMOND:''}</label>
        <button class="btn btn-danger btn-sm" data-del="${i}" aria-label="Hapus">${ic('x')}</button>
      </div>`).join('');
    $('mlist').querySelectorAll('.mrow').forEach(r=>{
      const i = +r.dataset.i;
      r.querySelectorAll('[data-f]').forEach(inp=>inp.onchange=()=>{
        const f=inp.dataset.f; S.models[i][f] = f==='auto'?inp.checked : f==='mult'? (+inp.value||1) : inp.value.trim();
        if(f==='mult') draw();
      });
      r.querySelector('[data-del]').onclick=()=>{ if(S.models.length>1){S.models.splice(i,1);draw();} };
    });
  };
  draw();

  const fetchModels = async (silent) => {
    const base = $('sbase').value.trim().replace(/\/+$/,''), key = $('skey').value.trim();
    if(!base || !key){ if(!silent) toast('Isi dulu','Base URL dan API key wajib diisi.','err'); return; }
    $('fetchModels').disabled = true;
    try{
      const res = await fetch(base+'/models', {headers:{'Authorization':'Bearer '+key}});
      const j = await res.json().catch(()=>({}));
      if(!res.ok) throw new Error((j.error&&(j.error.message||j.error)) || ('HTTP '+res.status));
      const ids = (j.data||j.models||[]).map(x=>typeof x==='string'?x:(x.id||x.name)).filter(Boolean);
      if(!ids.length) throw new Error('Daftar model dari API kosong.');
      const have = new Map(S.models.map(x=>[x.id,x]));
      const next = [have.get('auto')||DEFAULT_MODELS[0]];
      ids.forEach(id=>{
        if(id==='auto') return;
        const prem = PREMIUM_RE.test(id);
        next.push(have.get(id) || {id, label:id, mult:prem?15:1, auto:!prem});
      });
      S.models = next; draw();
      toast('Model diambil', `${ids.length} model dimuat. Cek kelipatan lalu simpan.`);
    }catch(e){
      if(!silent) toast('Gagal ambil model', esc(e.message||String(e)), 'err');
    }finally{ $('fetchModels').disabled = false; }
  };
  $('fetchModels').onclick = () => fetchModels(false);
  if(S.api.key && S.api.base && S.models===DEFAULT_MODELS) fetchModels(true);   // belum pernah disimpan: ambil otomatis

  $('addModel').onclick = () => { S.models.push({id:'',label:'',mult:1,auto:false}); draw(); };
  $('skeyShow').onclick = () => { const k=$('skey'); k.type = k.type==='password'?'text':'password'; $('skeyShow').textContent = k.type==='password'?'Lihat':'Sembunyikan'; };
  $('saveApi').onclick = async () => {
    const models = S.models.filter(m=>m.id).map(m=>({id:m.id,label:m.label||m.id,mult:+m.mult||1,auto:!!m.auto}));
    if(!models.length) return toast('Model kosong','Isi minimal satu model.','err');
    S.api = {key:$('skey').value.trim(), base:$('sbase').value.trim()};
    S.models = models;
    S.opts = {saveLogs: $('optLogs').checked};
    const {error} = await sb.from('settings').upsert([{key:'api',value:S.api},{key:'models',value:models},{key:'options',value:S.opts}]);
    if(error) return toast('Gagal menyimpan', esc(error.message), 'err');
    renderModels(); toast('Pengaturan disimpan','');
  };
}

boot();
</script>
</body>
</html>
